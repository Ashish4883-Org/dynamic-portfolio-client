<h3>👥 All Users : {{ users.length }}</h3>
<nz-table
  #userTable
  [nzBordered]="true"
  [nzPageSize]="5"
  [nzPageSizeOptions]="[5, 10, 15, 20]"
  [nzShowSizeChanger]="true"
  [nzShowPagination]="true"
  [nzData]="users"
  class="user-grid"
>
  <thead>
    <tr>
      <th>Master ID</th>
      <th>Name</th>
      <th>Role</th>
      <th>Status</th>
      <th>Chat</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let user of userTable.data">
      <td>{{ user.mstrid }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.role }}</td>
      <td>
        <span
          class="status-dot"
          [ngClass]="user.online ? 'online' : 'offline'"
        ></span>
        {{ user.online ? "Online" : "Offline" }}
      </td>
      <td>
        <!-- Chat Button -->
        <div class="chat-btn-wrapper">
          <button nz-button nzType="primary" (click)="startChat(user)">
            <nz-icon nzType="wechat" nzTheme="outline" />
          </button>
          <span class="pulse-dot"></span>
        </div>
      </td>
    </tr>
  </tbody>
</nz-table>

<!-- Chat Modal -->
<app-chat-modal
  [(isVisible)]="isChatModalVisible"
  [selectedUser]="selectedUser"
  [messages]="messages"
  (send)="sendMessage($event)"
  (cancel)="closeChatModal()"
  [width]="'600px'"
></app-chat-modal>
