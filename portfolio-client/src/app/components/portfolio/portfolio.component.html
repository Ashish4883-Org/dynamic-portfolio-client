<!-- ✅ Debug: confirm the template renders -->
<p style="color: green">✅ Template loaded</p>

<!-- ✅ Main conditional block -->
<ng-container *ngIf="user$ | async as user; else noUser">
  <h1>Welcome, {{ user.name || user.email || 'User' }}</h1>

  <!-- ✅ Sub-condition: if portfolio is not active -->
  <button
    *ngIf="user.isPortfolioActive === false"
    nz-button
    [nzType]="'primary'"
    (click)="createPortfolioForm()"
  >
    Create a Portfolio
  </button>
</ng-container>

<!-- ✅ Fallback: user is null -->
<ng-template #noUser>
  <h1>Welcome to Portfolio!</h1>
</ng-template>

<!-- ✅ Debug: show user value -->
<pre>{{ user$ | async | json }}</pre>

<h2>Users Online Status</h2>
<ul>
  <li *ngFor="let user of users">
    {{ user.name }} ({{ user.role }}) - 
    <span [style.color]="user.online ? 'green' : 'red'">
      {{ user.online ? 'Online' : 'Offline' }}
    </span>
  </li>
</ul>
