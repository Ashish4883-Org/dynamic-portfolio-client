<div class="center-box">
  <h1>Registration</h1>
  <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()">
    <!-- Full Name -->
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="fullName">
        Full Name
      </nz-form-label>
      <nz-form-control
        [nzSm]="14"
        [nzXs]="24"
        nzErrorTip="The input is not valid Name!"
      >
        <input nz-input formControlName="fullName" id="fullName" />
      </nz-form-control>
    </nz-form-item>

    <!-- Email -->
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="email">
        E-mail
      </nz-form-label>
      <nz-form-control
        [nzSm]="14"
        [nzXs]="24"
        nzErrorTip="The input is not valid E-mail!"
      >
        <input nz-input formControlName="email" id="email" />
      </nz-form-control>
    </nz-form-item>

    <!-- Password -->
    <!-- <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="password">
        Password
      </nz-form-label>
      <nz-form-control
        [nzSm]="14"
        [nzXs]="24"
        nzErrorTip="Please input your password!"
      >
        <input
          nz-input
          type="password"
          formControlName="password"
          id="password"
        />
      </nz-form-control>
    </nz-form-item> -->

    <nz-form-item>
      <nz-form-label [nzSpan]="6" nzRequired>Password</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <input
          nz-input
          type="password"
          formControlName="password"
          placeholder="Enter password"
        />
        <ng-container
          *ngIf="
            validateForm.get('password')?.dirty ||
            validateForm.get('password')?.touched
          "
        >
          <div
            *ngIf="validateForm.get('password')?.hasError('required')"
            class="text-red-500"
          >
            Password is required
          </div>
          <div
            *ngIf="validateForm.get('password')?.hasError('minlength')"
            class="text-red-500"
          >
            Password must be at least 6 characters long
          </div>
        </ng-container>
      </nz-form-control>
    </nz-form-item>

    <!-- Confirm Password -->
    <!-- <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="checkPassword">
        Confirm Password
      </nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <input
          nz-input
          type="password"
          formControlName="checkPassword"
          id="checkPassword"
        />

        @if (validateForm.controls.checkPassword.dirty ||
        validateForm.controls.checkPassword.touched) { @if
        (validateForm.hasError('passwordMismatch')) {
        <div class="ant-form-item-explain">
          Two passwords that you enter are inconsistent!
        </div>
        } @else if (validateForm.controls.checkPassword.hasError('required')) {
        <div class="ant-form-item-explain">Please confirm your password!</div>
        } }
      </nz-form-control>
    </nz-form-item> -->

    <nz-form-item>
      <nz-form-label [nzSpan]="6" nzRequired>Confirm Password</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <input
          nz-input
          type="password"
          formControlName="checkPassword"
          placeholder="Confirm password"
        />
        <ng-container
          *ngIf="
            validateForm.get('checkPassword')?.dirty ||
            validateForm.get('checkPassword')?.touched
          "
        >
          <div
            *ngIf="validateForm.get('checkPassword')?.hasError('required')"
            class="text-red-500"
          >
            Confirm Password is required
          </div>
          <div
            *ngIf="validateForm.hasError('passwordMismatch')"
            class="text-red-500"
          >
            Passwords do not match
          </div>
        </ng-container>
      </nz-form-control>
    </nz-form-item>

    <!-- Phone Number -->
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="phoneNumber">
        Phone Number
      </nz-form-label>
      <nz-form-control
        [nzSm]="14"
        [nzXs]="24"
        nzErrorTip="Please input your phone number!"
      >
        <nz-input-group [nzAddOnBefore]="addOnBeforeTemplate">
          <ng-template #addOnBeforeTemplate>
            <nz-select formControlName="phoneNumberPrefix" class="phone-select">
              <nz-option nzLabel="+91" nzValue="+91"></nz-option>
              <nz-option nzLabel="+1" nzValue="+1"></nz-option>
              <nz-option nzLabel="+44" nzValue="+44"></nz-option>
              <nz-option nzLabel="+61" nzValue="+61"></nz-option>
              <nz-option nzLabel="+592" nzValue="+592"></nz-option>
            </nz-select>
          </ng-template>
          <input formControlName="phoneNumber" id="phoneNumber" nz-input />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>

    <!-- Register Button -->
    <nz-form-item nz-row class="register-area">
      <nz-form-control [nzSpan]="14" class="button-container">
        <button nz-button style="width: 100%" nzType="primary" type="submit">
          Register
        </button>
      </nz-form-control>
    </nz-form-item>
  </form>
</div>
